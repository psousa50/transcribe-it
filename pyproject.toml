[project]
name = "transcript-cli"
version = "0.1.0"
description = "Lightweight CLI for ingesting, enriching, and storing meeting transcripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "litellm>=1.60",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.150",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
transcript = "transcript_cli.main:app"
