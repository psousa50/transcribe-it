[project]
name = "transcribe-it"
version = "0.4.0"
description = "Lightweight CLI for ingesting, enriching, and storing meeting transcripts"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pedro Sousa", email = "pedronsousa@gmail.com" },
]
keywords = ["transcripts", "meetings", "llm", "gmail", "slack", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
]
dependencies = [
    "typer>=0.15",
    "litellm>=1.60",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.150",
    "pyyaml>=6.0",
    "slack-sdk>=3.41.0",
    "questionary>=2.1.1",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcribe_it"]

[project.urls]
Homepage = "https://github.com/psousa50/transcribe-it"
Repository = "https://github.com/psousa50/transcribe-it"
Issues = "https://github.com/psousa50/transcribe-it/issues"

[project.scripts]
transcribe-it = "transcribe_it.main:app"
